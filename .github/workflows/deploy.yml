name: Publicar en Vultr

# Se activa cuando en GitHub → Settings → Secrets and variables → Actions existe
# la variable DEPLOY con valor "si" y los secretos VULTR_HOST, VULTR_USER y VULTR_SSH_KEY.
on:
  workflow_run:
    workflows: [Revisión]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: vars.DEPLOY == 'si' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar el servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          script: |
            cd /opt/sindes-web
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
